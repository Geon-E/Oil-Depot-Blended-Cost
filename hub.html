<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KK 저장소 복합단가</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --side: #fcfcfb; --line: #e2e1dc; --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
  --accent: #2a78d6; --accent-soft: #e6f0fc;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #121211; --side: #1a1a19; --line: #2f2f2c; --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84; --accent: #3987e5; --accent-soft: #1b2a3d; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; display: flex; }
aside { width: 220px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
.brand { font-weight: 700; font-size: 15px; padding: 0 10px 14px; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; color: var(--text-3); font-size: 12px; }
nav a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 600; }
nav a small { display: block; font-weight: 400; font-size: 12px; color: var(--text-3); }
nav a:hover { background: var(--bg); color: var(--text); }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--text-3); }
.foot a { color: var(--text-2); }
main { flex: 1; min-width: 0; position: relative; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); position: absolute; inset: 0; }
iframe[hidden] { display: none; }
@media (max-width: 760px) {
  body { flex-direction: column; }
  aside { width: auto; flex-direction: row; align-items: center; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .brand { padding: 0 8px 0 0; } .brand small, nav a small, .foot { display: none; }
  nav { display: flex; gap: 4px; }
  nav a { white-space: nowrap; padding: 8px 10px; }
  nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
}
</style>
</head>
<body>
<aside>
  <div class="brand">KK 저장소<small>복합단가 업무 도구</small></div>
  <nav aria-label="앱 선택">
    <a href="#ledger" data-app="ledger.html">복합단가 관리<small>원본 업로드 → 대시보드·원장</small></a>
    <a href="#simulator" data-app="index.html">사입 시뮬레이터<small>경유 사입량·목표 단가</small></a>
  </nav>
  <div class="foot">새 창에서 열기: <a id="openNew" href="ledger.html" target="_blank" rel="noopener">현재 앱</a></div>
</aside>
<main id="frames"></main>
<script>
const links = [...document.querySelectorAll('nav a')];
function show() {
  const key = (location.hash || '#ledger').slice(1);
  const a = links.find((l) => l.getAttribute('href') === '#' + key) || links[0];
  links.forEach((l) => (l === a ? l.setAttribute('aria-current', 'page') : l.removeAttribute('aria-current')));
  // 앱마다 화면을 하나씩 띄워 두고 보이기만 전환 → 올린 원본·입력값이 유지됨
  const box = document.getElementById('frames');
  let f = box.querySelector(`iframe[data-app="${a.dataset.app}"]`);
  if (!f) {
    f = document.createElement('iframe');
    f.dataset.app = a.dataset.app; f.title = a.firstChild.textContent.trim(); f.src = a.dataset.app;
    box.appendChild(f);
  }
  box.querySelectorAll('iframe').forEach((x) => (x.hidden = x !== f));
  document.getElementById('openNew').href = a.dataset.app;
  document.title = a.firstChild.textContent.trim() + ' · KK 저장소';
}
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
