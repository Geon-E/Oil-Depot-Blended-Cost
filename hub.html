<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KK 저장소 복합단가</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --side: #fcfcfb; --line: #e2e1dc; --text: #0b0b0b; --text-2: #52514e; --text-3: #6b6a65;
  --accent: #2a78d6; --accent-soft: #e6f0fc; --crit: #c62f2f; --crit-soft: #fdecec; --warn-soft: #fff5dc;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #121211; --side: #1a1a19; --line: #2f2f2c; --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84; --accent: #3987e5; --accent-soft: #1b2a3d; --crit: #e66767; --crit-soft: #3a1c1c; --warn-soft: #33290f; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); display: flex;
  font: 14px/1.6 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all;
}
aside { width: 216px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 10px; gap: 2px; overflow-y: auto; }
.brand { font-weight: 700; font-size: 15px; padding: 0 10px 16px; letter-spacing: -0.01em; line-height: 1.35; }
.brand small { display: block; font-weight: 400; color: var(--text-3); font-size: 12px; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 600; transition: background-color .15s ease-out; }
nav a:hover { background: var(--bg); color: var(--text); }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav a.app[aria-current="page"] { color: var(--text); }
.sub { display: flex; flex-direction: column; gap: 1px; margin: 0 0 8px 12px; padding-left: 8px; border-left: 1px solid var(--line); }
.sub[hidden] { display: none; }
.sub a { font-weight: 500; font-size: 13px; padding: 6px 10px; }
.sub a[aria-current="page"] { background: var(--accent-soft); color: var(--text); font-weight: 700; }
.sub .sep { height: 1px; background: var(--line); margin: 4px 10px; }
.badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 18px; }
.badge.crit { color: var(--crit); background: var(--crit-soft); }
.badge.warn { color: var(--text); background: var(--warn-soft); }
.foot { margin-top: auto; padding: 10px 12px; font-size: 12px; color: var(--text-3); }
.foot a { color: var(--text-2); }
main { flex: 1; min-width: 0; position: relative; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); position: absolute; inset: 0; }
iframe[hidden] { display: none; }
@media (max-width: 760px) {
  body { flex-direction: column; }
  aside { width: auto; flex-direction: row; align-items: center; padding: 6px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
  .brand { padding: 0 8px 0 0; white-space: nowrap; } .brand small, .foot { display: none; }
  nav { flex-direction: row; align-items: center; }
  .sub { flex-direction: row; margin: 0; padding-left: 6px; border-left: 1px solid var(--line); }
  .sub .sep { display: none; }
  nav a { white-space: nowrap; padding: 6px 10px; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">KK 저장소<small>복합단가 업무 도구</small></div>
  <nav aria-label="메뉴">
    <a class="app" href="#ledger" data-app="ledger.html">복합단가 관리</a>
    <div class="sub" id="ledgerSub" data-for="ledger"></div>
    <a class="app" href="#simulator" data-app="index.html">사입 시뮬레이터</a>
  </nav>
  <div class="foot"><a id="openNew" href="ledger.html" target="_blank" rel="noopener">새 창에서 열기</a></div>
</aside>
<main id="frames"></main>
<script>
// 복합단가 관리 하위 메뉴 (앱에서 확인 필요 건수를 받아 배지로 표시)
let ledgerItems = [['dash', '대시보드'], ['침산', '침산'], ['단지', '단지'], ['신도시', '신도시'], ['안동북부', '안동북부'], ['settings', '설정']].map(([key, label]) => ({ key, label, crit: 0, warn: 0 }));
let ledgerActive = 'dash';
const apps = [...document.querySelectorAll('nav a.app')];

function renderSub() {
  const box = document.getElementById('ledgerSub');
  box.innerHTML = ledgerItems.map((it) => {
    const badge = it.crit ? `<span class="badge crit" title="확인 필요">${it.crit}</span>` : it.warn ? `<span class="badge warn">${it.warn}</span>` : '';
    const sep = it.key === 'settings' ? '<div class="sep"></div>' : '';
    return `${sep}<a href="#ledger/${encodeURIComponent(it.key)}" data-sub="${it.key}"${it.key === ledgerActive ? ' aria-current="page"' : ''}>${it.label}${badge}</a>`;
  }).join('');
}

function parseHash() {
  const [app, sub] = (location.hash.slice(1) || 'ledger').split('/');
  return { app: app === 'simulator' ? 'simulator' : 'ledger', sub: sub ? decodeURIComponent(sub) : null };
}

function show() {
  const { app, sub } = parseHash();
  const a = apps.find((l) => l.getAttribute('href') === '#' + app) || apps[0];
  apps.forEach((l) => (l === a ? l.setAttribute('aria-current', 'page') : l.removeAttribute('aria-current')));
  document.getElementById('ledgerSub').hidden = app !== 'ledger';
  // 앱마다 화면을 하나씩 띄워 두고 보이기만 전환 → 올린 원본·입력값이 유지됨
  const box = document.getElementById('frames');
  let f = box.querySelector(`iframe[data-app="${a.dataset.app}"]`);
  if (app === 'ledger' && sub) ledgerActive = sub;
  if (!f) {
    f = document.createElement('iframe');
    f.dataset.app = a.dataset.app; f.title = a.textContent.trim();
    f.src = a.dataset.app + (app === 'ledger' ? '#' + encodeURIComponent(ledgerActive) : '');
    box.appendChild(f);
  } else if (app === 'ledger' && sub) {
    // replace: 앱 안쪽 이동이 뒤로 가기 기록에 따로 쌓이지 않게
    try { const w = f.contentWindow; w.location.replace(w.location.pathname + '#' + encodeURIComponent(sub)); } catch { /* 무시 */ }
  }
  box.querySelectorAll('iframe').forEach((x) => (x.hidden = x !== f));
  document.getElementById('openNew').href = a.dataset.app + (app === 'ledger' ? '#' + encodeURIComponent(ledgerActive) : '');
  document.title = a.textContent.trim() + ' · KK 저장소';
  renderSub();
}

// 앱 안에서 탭이 바뀌면(카드 클릭 등) 메뉴 강조와 주소를 맞춤
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'ledger-tabs') return;
  ledgerItems = e.data.items; ledgerActive = e.data.active;
  if (parseHash().app === 'ledger') {
    const h = '#ledger/' + encodeURIComponent(ledgerActive);
    if (location.hash !== h) history.replaceState(null, '', h);
    document.getElementById('openNew').href = 'ledger.html#' + encodeURIComponent(ledgerActive);
  }
  renderSub();
});
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
